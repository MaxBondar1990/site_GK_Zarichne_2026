<section class="location-band neighborhood-map" data-fls-neighborhood-map id="neighborhood" aria-labelledby="neighborhood-title">
  <div class="neighborhood-map__stage">
    <div class="neighborhood-map__canvas" role="region" aria-label="Інтерактивна карта інфраструктури навколо будинку Заріччя"></div>
    <div class="neighborhood-map__tools" role="group" aria-label="Перегляд карти">
      <button type="button" data-map-home>До будинку</button>
      <button type="button" data-map-fit>Усі точки</button>
    </div>
    <p class="neighborhood-map__status" role="status">Завантажуємо карту…</p>
  </div>
  <div class="neighborhood-map__content">
    <p class="kicker">04 / ВАША НОВА АДРЕСА</p>
    <h2 id="neighborhood-title">Місто навколо<br>вашого дому.</h2>
    <p class="neighborhood-map__address">Березань, вул. Героїв Небесної Сотні, 68</p>
    <div class="neighborhood-map__filters" role="group" aria-label="Категорії інфраструктури">
      <button type="button" data-map-category="all" aria-pressed="true">Усе</button>
      <button type="button" data-map-category="education" aria-pressed="false">Освіта</button>
      <button type="button" data-map-category="shopping" aria-pressed="false">Покупки</button>
      <button type="button" data-map-category="health" aria-pressed="false">Здоров’я</button>
      <button type="button" data-map-category="leisure" aria-pressed="false">Дозвілля</button>
      <button type="button" data-map-category="transport" aria-pressed="false">Транспорт</button>
    </div>
    <p class="neighborhood-map__count" aria-live="polite"></p>
    <div class="neighborhood-map__places" role="group" aria-label="Місця навколо будинку"></div>
    <p class="neighborhood-map__note">Відстані по прямій від будинку. Маршрути та час у дорозі — у Google Картах.</p>
    <a class="text-link neighborhood-map__google" href="https://www.google.com/maps/search/?api=1&amp;query=50.317114%2C31.445783" target="_blank" rel="noopener noreferrer">Будинок у Google Картах</a>
  </div>
</section>
