<section class="booking-strip" data-fls-booking-strip>
  <div class="booking-strip__container">
    <div class="booking-strip__panel">
      <div class="booking-strip__content"><h2>Запишіться<br>на перегляд</h2><p>Побачте квартиру наживо та відчуйте атмосферу майбутнього дому.</p></div>
      <form class="booking-strip__form" data-request-form>
        <label class="field">Ім’я *<input name="name" placeholder="Ваше ім’я" autocomplete="given-name" required maxlength="80"></label>
        <label class="field">Телефон *<input name="phone" type="tel" placeholder="+38 (0XX) XXX-XX-XX" autocomplete="tel" required minlength="10" maxlength="24"></label>
        <button class="button" type="submit">Запис на перегляд ↗</button>
        <p class="booking-strip__note note">Демонстраційна форма. Дані не надсилаються й не зберігаються.</p>
        <p class="booking-strip__status" role="status"></p>
      </form>
    </div>
  </div>
</section>
