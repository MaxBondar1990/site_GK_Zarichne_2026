<dialog class="viewer" data-fls-viewer aria-labelledby="viewer-title">
  <div class="viewer__head">
    <h2 class="viewer__title" id="viewer-title">Перегляд</h2><button class="viewer__close"
      aria-label="Закрити зображення">✕</button>
  </div><img class="viewer__image" alt="">
  <div class="viewer__actions"><button class="button button--outline" data-view-prev
      aria-label="Попереднє фото">←</button><a class="text-link viewer__original" target="_blank"
      rel="noopener">Відкрити оригінал ↗</a><button class="button button--outline" data-view-next
      aria-label="Наступне фото">→</button></div>
  <p class="viewer__count" aria-live="polite"></p>
</dialog>
